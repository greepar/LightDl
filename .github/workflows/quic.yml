name: MsQuic integration

on:
  push:
    branches: [ 'feat/msquic-*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  QUIC_PACKAGE_VERSION: 0.4.6-quic-ci.${{ github.run_number }}.${{ github.run_attempt }}

jobs:
  native-crypto:
    name: Build .NET 11 crypto / ${{ matrix.platform.rid }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-24.04, rid: linux-x64, musl: false }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, musl: false }
          - { os: ubuntu-24.04, rid: linux-musl-x64, musl: true }
          - { os: ubuntu-24.04-arm, rid: linux-musl-arm64, musl: true }
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dotnet/runtime
          ref: 474ed963699fc29809015392738a15231aaae2de
          path: .native-build/runtime
          sparse-checkout: |
            src/native/libs/System.Security.Cryptography.Native
            src/native/libs/Common
            src/native/minipal
      - name: Build glibc shim
        if: ${{ !matrix.platform.musl }}
        run: |
          sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libssl-dev
          sh eng/build-net11-crypto.sh .native-build/runtime native-net11/${{ matrix.platform.rid }}
      - name: Build musl shim
        if: matrix.platform.musl
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            mcr.microsoft.com/dotnet/sdk:11.0.100-rc.2-alpine3.24-aot \
            sh -c 'apk add --no-cache clang build-base zlib-dev cmake ninja openssl-dev && \
              sh eng/build-net11-crypto.sh .native-build/runtime native-net11/${{ matrix.platform.rid }} && \
              chmod -R a+rwX native-net11'
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-${{ matrix.platform.rid }}
          path: native-net11/*/libSystem.Security.Cryptography.Native.OpenSsl.a
          if-no-files-found: error

  package:
    needs: native-crypto
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.402
            11.0.100-rc.2.26504.105
      - uses: actions/download-artifact@v4
        with:
          pattern: crypto-*
          merge-multiple: true
          path: src/LightDl/buildTransitive/native/net11
      - name: Test net10.0 and net11.0
        shell: bash
        run: |
          for tfm in net10.0 net11.0; do
            dotnet test tests/LightDl.Tests/LightDl.Tests.csproj -c Release \
              -p:TargetFramework="$tfm" -p:TargetFrameworks="$tfm" \
              --test-adapter-path "$HOME/.nuget/packages/xunit.runner.visualstudio/3.1.5/build/net8.0"
          done
      - name: Pack both frameworks
        run: dotnet pack src/LightDl/LightDl.csproj -c Release -p:PackageVersion=${{ env.QUIC_PACKAGE_VERSION }} -o artifacts
      - name: Verify default and shared deployments
        run: python3 eng/verify-quic-package.py artifacts/LightDl.${{ env.QUIC_PACKAGE_VERSION }}.nupkg
      - uses: actions/upload-artifact@v4
        with:
          name: quic-nuget
          path: artifacts/*.nupkg
          if-no-files-found: error

  static:
    name: Static ${{ matrix.platform.rid }} / ${{ matrix.tfm }}
    needs: package
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        tfm: [ net10.0, net11.0 ]
        platform:
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
          - { os: ubuntu-24.04, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-15-intel, rid: osx-x64 }
          - { os: macos-15, rid: osx-arm64 }
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.402
            11.0.100-rc.2.26504.105
      - uses: actions/download-artifact@v4
        with:
          name: quic-nuget
          path: artifacts
      - name: Install native build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish from NuGet package
        shell: bash
        run: |
          python3 eng/write-quic-nuget-config.py
          dotnet publish tests/LightDl.QuicSmoke/LightDl.QuicSmoke.csproj -c Release \
            -r '${{ matrix.platform.rid }}' -p:LightDlSmokeTargetFramework='${{ matrix.tfm }}' \
            -p:LightDlTestPackageVersion="$QUIC_PACKAGE_VERSION" \
            --configfile "$PWD/Quic.NuGet.Config" -o publish
      - name: Run local HTTP/3 and certificate validation test
        shell: bash
        run: |
          python3 eng/run-quic-smoke.py publish/LightDl.QuicSmoke
      - name: Inspect native dependencies
        shell: bash
        run: python3 eng/inspect-quic-binary.py publish/LightDl.QuicSmoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quic-${{ matrix.platform.rid }}-${{ matrix.tfm }}
          path: publish/*
          if-no-files-found: ignore

  musl:
    name: Static ${{ matrix.platform.rid }} / ${{ matrix.tfm }}
    needs: package
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        tfm: [ net10.0, net11.0 ]
        platform:
          - { os: ubuntu-24.04, rid: linux-musl-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-musl-arm64 }
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quic-nuget
          path: artifacts
      - name: Publish and execute in Alpine
        shell: bash
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e QUIC_PACKAGE_VERSION="$QUIC_PACKAGE_VERSION" \
            -e TARGET_FRAMEWORK='${{ matrix.tfm }}' -e TARGET_RID='${{ matrix.platform.rid }}' \
            mcr.microsoft.com/dotnet/sdk:11.0.100-rc.2-alpine3.24-aot \
            sh -c 'apk add --no-cache clang build-base zlib-dev && \
              dotnet publish tests/LightDl.QuicSmoke/LightDl.QuicSmoke.csproj -c Release \
              -r "$TARGET_RID" -p:LightDlSmokeTargetFramework="$TARGET_FRAMEWORK" \
              -p:LightDlTestPackageVersion="$QUIC_PACKAGE_VERSION" \
              -p:StaticExecutable=true -p:InvariantGlobalization=true \
              --source /src/artifacts --source https://api.nuget.org/v3/index.json -o publish && \
              ./publish/LightDl.QuicSmoke && chmod -R a+rwX publish'
      - name: Inspect fully static ELF
        run: python3 eng/inspect-quic-binary.py publish/LightDl.QuicSmoke --fully-static
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quic-${{ matrix.platform.rid }}-${{ matrix.tfm }}
          path: publish/*
          if-no-files-found: ignore
