name: Build NuGet

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish to NuGet (for example v0.4.6); empty builds CI artifacts only"
        required: false
        type: string

jobs:
  pack:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.402
            11.0.100-rc.2.26504.105

      - name: Restore
        run: dotnet restore src/LightDl/LightDl.csproj

      - name: Build
        run: dotnet build src/LightDl/LightDl.csproj --configuration Release --no-restore

      - name: Resolve package version
        id: version
        shell: pwsh
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $releaseTag = $env:INPUT_RELEASE_TAG
          if (-not $releaseTag -and $env:GITHUB_REF -like 'refs/tags/v*') {
            $releaseTag = $env:GITHUB_REF_NAME
          }
          if ($releaseTag) {
            if ($releaseTag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
              throw "Expected an existing stable release tag such as v0.4.6."
            }
            $version = $releaseTag.Substring(1)
            "publish=true" >> $env:GITHUB_OUTPUT
          } else {
            $version = "0.1.0-ci.$env:GITHUB_RUN_NUMBER"
            "publish=false" >> $env:GITHUB_OUTPUT
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$releaseTag" >> $env:GITHUB_OUTPUT

      - name: Pack
        if: inputs.release_tag == ''
        run: dotnet pack src/LightDl/LightDl.csproj --configuration Release --output artifacts /p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Reuse the existing release package
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern "LightDl.$env:PACKAGE_VERSION.nupkg" --dir artifacts

      - name: Verify MsQuic package options
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path artifacts -Filter *.nupkg | Select-Object -First 1
          python eng/verify-quic-package.py $package.FullName

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg

      - name: NuGet login
        if: steps.version.outputs.publish == 'true'
        id: login
        uses: NuGet/login@v1
        with:
          user: greepar

      - name: Publish to NuGet
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path artifacts -Filter *.nupkg | Select-Object -First 1
          if ($null -eq $package) {
            throw "No NuGet package found in artifacts"
          }
          dotnet nuget push $package.FullName --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
