name: Windows QUIC loader diagnostics
on:
  push:
    branches: [ 'feat/msquic-static-net11' ]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quic-${{ matrix.rid }}-net10.0
          run-id: 40082656737
          github-token: ${{ github.token }}
          path: diagnostic
      - name: Resolve imports and diagnose startup
        run: python eng/run-quic-smoke.py diagnostic/LightDl.QuicSmoke.exe
